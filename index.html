<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SidelineReel Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width app column, sticky team header, bottom tab bar; screens swap in place. */
:root {
  --bg: #eef2ee;        /* chalked turf off-white */
  --surface: #ffffff;
  --ink: #15211b;
  --muted: #5b6a61;
  --line: #d5ddd7;
  --field: #1e6a46;     /* pitch green, primary accent */
  --field-soft: #dcebe2;
  --pinny: #f0b923;     /* training-bib yellow, fills only */
  --warn: #b54708;
  --warn-soft: #fdecd9;
  --ok: #1e6a46;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Public Sans", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1612; --surface: #18221c; --ink: #e6ede8; --muted: #9aaba1; --line: #2a3a31;
  --field: #4fbf86; --field-soft: #1d3a2b; --pinny: #f0b923; --warn: #f2a65a; --warn-soft: #3a2614; --ok: #4fbf86;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1612; --surface: #18221c; --ink: #e6ede8; --muted: #9aaba1; --line: #2a3a31;
  --field: #4fbf86; --field-soft: #1d3a2b; --pinny: #f0b923; --warn: #f2a65a; --warn-soft: #3a2614; --ok: #4fbf86;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.app { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.proto-flag { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; padding: 8px 16px; border-bottom: 1px dashed var(--line); }

header.team { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--field); color: #fff; padding: 14px 16px 12px; }
header.team .club { font: 600 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
header.team h1 { font: 700 28px/1.05 var(--display); margin: 4px 0 0; text-wrap: balance; }
header.team .game { font-size: 13px; opacity: .9; margin-top: 4px; }

main { flex: 1; padding: 16px 16px 96px; display: flex; flex-direction: column; gap: 16px; }
h2 { font: 700 22px/1.1 var(--display); margin: 0; letter-spacing: .01em; }
.label { font: 600 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sub { color: var(--muted); font-size: 13px; margin: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

/* roster */
.kid { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer; }
.kid:last-child { border-bottom: 0; }
.kid:hover { background: var(--field-soft); }
.jersey { width: 44px; height: 44px; border-radius: 8px; background: var(--pinny); color: #15211b; display: grid; place-items: center; font: 700 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.kid .name { font-weight: 600; }
.kid .meta { font-size: 12px; color: var(--muted); }
.count { font: 500 13px/1 var(--mono); color: var(--field); font-variant-numeric: tabular-nums; }

/* clips */
.clip { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.clip:last-child { border-bottom: 0; }
.ts { font: 500 13px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.ts small { display: block; color: var(--muted); font-size: 11px; }
.chip { font: 600 11px/1 var(--body); padding: 5px 8px; border-radius: 99px; white-space: nowrap; }
.chip.ok { background: var(--field-soft); color: var(--ok); }
.chip.review { background: var(--warn-soft); color: var(--warn); }

/* reel player */
.player { aspect-ratio: 16 / 9; max-width: 100%; border-radius: 10px; position: relative; overflow: hidden;
  background: repeating-linear-gradient(90deg, #2c7a50 0 12%, #277048 12% 24%); }
.player .lines { position: absolute; inset: 8%; border: 2px solid rgba(255,255,255,.55); }
.player .lines::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px solid rgba(255,255,255,.55); }
.player .dot { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--pinny); color: #15211b; display: grid; place-items: center; font: 700 15px/1 var(--display); box-shadow: 0 0 0 4px rgba(240,185,35,.35); transition: left .9s ease, top .9s ease; }
.player .cap { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-end; color: #fff; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,.6); gap: 8px; }
.player .cap b { font: 700 20px/1 var(--display); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--field); transition: width .3s linear; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button.btn { font: 600 14px/1 var(--body); padding: 11px 16px; border-radius: 8px; border: 1px solid var(--field); background: var(--field); color: #fff; cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--field); }
button:focus-visible, .kid:focus-visible, nav button:focus-visible { outline: 2px solid var(--pinny); outline-offset: 2px; }

/* recap email */
.email { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.email .from { font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.score { font: 700 40px/1 var(--display); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 10px; border-radius: 8px; background: var(--field-soft); }
.stat b { display: block; font: 700 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }

/* feature slot */
.slot { border: 2px dashed var(--line); border-radius: 10px; padding: 24px 16px; text-align: center; color: var(--muted); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { background: none; border: 0; padding: 10px 2px 12px; font: 600 11px/1.2 var(--body); color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
nav.tabs button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
nav.tabs button[aria-selected="true"] { color: var(--field); }
nav.tabs button.new[aria-selected="false"] { color: var(--warn); }

.toast { position: fixed; max-width: calc(100% - 32px); left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13px; z-index: 4; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="app">
  <div class="proto-flag">Prototype · sample data, not real families</div>
  <header class="team">
    <div class="club" id="club"></div>
    <h1 id="teamName"></h1>
    <div class="game" id="gameLine"></div>
  </header>
  <main id="screen"></main>
</div>

<nav class="tabs" aria-label="Screens"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
/* ============ MOCK DATA: swap during the sprint ============ */
const DATA = {
  club: "Riverside Youth Soccer Club",
  team: "Rockets U10 Girls",
  coach: "Coach Dana M.",
  game: { opponent: "Eastside Eagles", date: "Sat, Oct 31", score: [3, 2], footage: "52 min · 2 halves · uploaded 4:12 pm" },
  roster: [
    { no: 4,  name: "Maya R.",    families: 2 },
    { no: 7,  name: "Priya S.",   families: 1 },
    { no: 9,  name: "Lena O.",    families: 2 },
    { no: 11, name: "Ava T.",     families: 1 },
    { no: 14, name: "Zoe K.",     families: 2 },
    { no: 17, name: "Hana W.",    families: 1 },
    { no: 21, name: "Sofia G.",   families: 1 },
    { no: 23, name: "Nia B.",     families: 2 }
  ],
  // conf = how sure the auto-tagger is that it's this kid; below 0.8 goes to coach review
  clips: [
    { no: 9,  type: "Goal",   t: "08:41", half: 1, conf: 0.97, x: 82, y: 46 },
    { no: 4,  type: "Assist", t: "08:33", half: 1, conf: 0.93, x: 66, y: 30 },
    { no: 21, type: "Save",   t: "17:05", half: 1, conf: 0.95, x: 10, y: 52 },
    { no: 14, type: "Tackle", t: "22:48", half: 1, conf: 0.71, x: 38, y: 62 },
    { no: 7,  type: "Goal",   t: "04:12", half: 2, conf: 0.91, x: 84, y: 54 },
    { no: 11, type: "Shot",   t: "11:30", half: 2, conf: 0.88, x: 76, y: 38 },
    { no: 9,  type: "Goal",   t: "19:57", half: 2, conf: 0.96, x: 86, y: 50 },
    { no: 17, type: "Tackle", t: "21:02", half: 2, conf: 0.64, x: 30, y: 44 },
    { no: 23, type: "Pass",   t: "23:15", half: 2, conf: 0.84, x: 55, y: 28 }
  ],
  recap: { sendTime: "Sun 9:00 am", families: 12 }
};
/* ============ END MOCK DATA ============ */

const $ = s => document.querySelector(s);
const kidByNo = no => DATA.roster.find(k => k.no === no);
const clipsFor = no => DATA.clips.filter(c => c.no === no);
const REVIEW_AT = 0.8;
let current = DATA.roster[2].no; // kid shown in Reel by default
let timer = null;

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }

const ICONS = {
  team:  '<path d="M16 19v-1a4 4 0 0 0-8 0v1"/><circle cx="12" cy="8" r="3"/>',
  clips: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/>',
  reel:  '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/>',
  recap: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  new:   '<path d="M12 5v14M5 12h14"/>'
};
const SCREENS = {
  team:  { label: "Team",  render: renderTeam },
  clips: { label: "Clips", render: renderClips },
  reel:  { label: "Reel",  render: renderReel },
  recap: { label: "Recap", render: renderRecap },
  new:   { label: "P1",    render: renderFeature }   // ← P1 FEATURE SLOT
};

function renderTeam() {
  return `<div class="stack"><h2>Roster</h2><p class="sub">${DATA.roster.length} players · tap a player to see their reel</p></div>
  <div class="panel">${DATA.roster.map(k => `
    <button class="kid" data-kid="${k.no}">
      <span class="jersey">${k.no}</span>
      <span><span class="name">${k.name}</span><br><span class="meta">${k.families} famil${k.families > 1 ? "ies" : "y"} on recap</span></span>
      <span class="count">${clipsFor(k.no).length} clips</span>
    </button>`).join("")}</div>`;
}

function renderClips() {
  const review = DATA.clips.filter(c => c.conf < REVIEW_AT).length;
  return `<div class="stack"><h2>Game clips</h2><p class="sub">${DATA.game.footage}</p></div>
  ${review ? `<p class="chip review" style="align-self:flex-start">${review} clips need coach review before reels send</p>` : ""}
  <div class="panel">${DATA.clips.map((c, i) => {
    const k = kidByNo(c.no);
    return `<div class="clip">
      <span class="ts">${c.t}<small>Half ${c.half}</small></span>
      <span><b>#${c.no} ${k.name}</b><br><span class="sub">${c.type} · ${Math.round(c.conf * 100)}% match</span></span>
      ${c.conf < REVIEW_AT ? `<button class="chip review" data-confirm="${i}" style="border:0;cursor:pointer">Confirm</button>` : `<span class="chip ok">Tagged</span>`}
    </div>`; }).join("")}</div>`;
}

function renderReel() {
  const k = kidByNo(current), cl = clipsFor(current);
  return `<div class="stack"><span class="label">Personal reel</span><h2>#${k.no} ${k.name}</h2>
    <p class="sub">${cl.length} moments vs ${DATA.game.opponent} · ${DATA.game.date}</p></div>
  <div class="player" id="player"><div class="lines"></div><div class="dot" id="dot" style="left:50%;top:50%">${k.no}</div>
    <div class="cap"><span><b id="capType">Ready</b><br><span id="capTime">${cl.length} clips</span></span><span id="capIdx"></span></div></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="row"><button class="btn" id="play">Play reel</button>
    <button class="btn ghost" id="share">Copy family link</button></div>
  <div class="stack"><span class="label">Switch player</span><div class="row">${DATA.roster.map(r =>
    `<button class="btn ghost" data-kid="${r.no}" style="padding:8px 10px${r.no === current ? ";background:var(--field-soft)" : ""}">#${r.no}</button>`).join("")}</div></div>`;
}

function playReel() {
  const cl = clipsFor(current); if (!cl.length) return toast("No clips for this player yet");
  clearInterval(timer); let i = 0;
  const step = () => {
    if (i >= cl.length) { clearInterval(timer); $("#capType").textContent = "End of reel"; return; }
    const c = cl[i]; const dot = $("#dot"); if (!dot) return clearInterval(timer);
    dot.style.left = c.x + "%"; dot.style.top = c.y + "%";
    $("#capType").textContent = c.type; $("#capTime").textContent = `Half ${c.half} · ${c.t}`;
    $("#capIdx").textContent = `${i + 1}/${cl.length}`; $("#prog").style.width = ((i + 1) / cl.length * 100) + "%";
    i++;
  };
  step(); timer = setInterval(step, 1600);
}

function renderRecap() {
  const [us, them] = DATA.game.score;
  const tagged = DATA.clips.filter(c => c.conf >= REVIEW_AT).length;
  const kidsWith = new Set(DATA.clips.map(c => c.no)).size;
  return `<div class="stack"><span class="label">Weekly family recap · preview</span><h2>Sends ${DATA.recap.sendTime}</h2></div>
  <div class="panel email">
    <div class="from">From: ${DATA.coach} via SidelineReel<br>To: ${DATA.recap.families} families on the ${DATA.team} roster</div>
    <span class="label">${DATA.game.date} · vs ${DATA.game.opponent}</span>
    <div class="score">${us}–${them} ${us > them ? "Win" : us < them ? "Loss" : "Draw"}</div>
    <div class="stats">
      <div class="stat"><b>${tagged}</b><span>highlights</span></div>
      <div class="stat"><b>${kidsWith}/${DATA.roster.length}</b><span>players featured</span></div>
      <div class="stat"><b>${DATA.clips.filter(c => c.type === "Goal").length}</b><span>goals on film</span></div>
    </div>
    <p style="margin:0">Your player's personal reel is ready. Tap below to watch.</p>
    <button class="btn" data-go="reel">Watch your reel</button>
  </div>`;
}

/* ===== P1 FEATURE: replace this function during the sprint ===== */
function renderFeature() {
  return `<div class="stack"><span class="label">Next feature</span><h2>P1 goes here</h2></div>
  <div class="slot">This screen is held for the feature chosen in the sprint.<br>The roster, clips, reel and recap screens are already working.</div>`;
}

function go(id) {
  clearInterval(timer);
  $("#screen").innerHTML = SCREENS[id].render();
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === id));
  try { localStorage.setItem("sr-tab", id); } catch (e) {}
  window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab) go(b.dataset.tab);
  else if (b.dataset.kid) { current = +b.dataset.kid; go("reel"); }
  else if (b.dataset.go) go(b.dataset.go);
  else if (b.dataset.confirm) { DATA.clips[+b.dataset.confirm].conf = 0.99; go("clips"); toast("Tag confirmed"); }
  else if (b.id === "play") playReel();
  else if (b.id === "share") {
    const link = `sidelinereel.app/r/${DATA.team.split(" ")[0].toLowerCase()}-${current}`;
    const done = () => toast("Link copied (sample link)");
    navigator.clipboard?.writeText(link).then(done, () => toast(link)) ?? toast(link);
  }
});

$("#club").textContent = DATA.club;
$("#teamName").textContent = DATA.team;
$("#gameLine").textContent = `vs ${DATA.game.opponent} · ${DATA.game.date} · ${DATA.game.score.join("–")}`;
$("#tabs").innerHTML = Object.entries(SCREENS).map(([id, s]) =>
  `<button data-tab="${id}" class="${id === "new" ? "new" : ""}" aria-selected="false"><svg viewBox="0 0 24 24">${ICONS[id]}</svg>${s.label}</button>`).join("");
let start = "team"; try { start = localStorage.getItem("sr-tab") || "team"; } catch (e) {}
go(SCREENS[start] ? start : "team");
</script>
</body>
</html>
