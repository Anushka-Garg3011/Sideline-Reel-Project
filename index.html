<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SidelineReel Jersey Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width app column, sticky team header, bottom tab bar; screens swap in place. */
:root {
  --bg: #eef2ee;        /* chalked turf off-white */
  --surface: #ffffff;
  --ink: #15211b;
  --muted: #5b6a61;
  --line: #d5ddd7;
  --field: #1e6a46;     /* pitch green, primary accent */
  --field-soft: #dcebe2;
  --pinny: #f0b923;     /* training-bib yellow, fills only */
  --warn: #b54708;
  --warn-soft: #fdecd9;
  --ok: #1e6a46;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Public Sans", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1612; --surface: #18221c; --ink: #e6ede8; --muted: #9aaba1; --line: #2a3a31;
  --field: #4fbf86; --field-soft: #1d3a2b; --pinny: #f0b923; --warn: #f2a65a; --warn-soft: #3a2614; --ok: #4fbf86;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1612; --surface: #18221c; --ink: #e6ede8; --muted: #9aaba1; --line: #2a3a31;
  --field: #4fbf86; --field-soft: #1d3a2b; --pinny: #f0b923; --warn: #f2a65a; --warn-soft: #3a2614; --ok: #4fbf86;
  color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.app { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; background: var(--bg); }
.proto-flag { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; padding: 8px 16px; border-bottom: 1px dashed var(--line); }

header.team { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--field); color: #fff; padding: 14px 16px 12px; }
header.team .club { font: 600 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
header.team h1 { font: 700 28px/1.05 var(--display); margin: 4px 0 0; text-wrap: balance; }
header.team .game { font-size: 13px; opacity: .9; margin-top: 4px; }

main { flex: 1; padding: 16px 16px 96px; display: flex; flex-direction: column; gap: 16px; }
h2 { font: 700 22px/1.1 var(--display); margin: 0; letter-spacing: .01em; }
.label { font: 600 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sub { color: var(--muted); font-size: 13px; margin: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

/* roster */
.kid { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer; }
.kid:last-child { border-bottom: 0; }
.kid:hover { background: var(--field-soft); }
.jersey { width: 44px; height: 44px; border-radius: 8px; background: var(--pinny); color: #15211b; display: grid; place-items: center; font: 700 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.kid .name { font-weight: 600; }
.kid .meta { font-size: 12px; color: var(--muted); }
.count { font: 500 13px/1 var(--mono); color: var(--field); font-variant-numeric: tabular-nums; }

/* clips */
.clip { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.clip:last-child { border-bottom: 0; }
.ts { font: 500 13px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.ts small { display: block; color: var(--muted); font-size: 11px; }
.chip { font: 600 11px/1 var(--body); padding: 5px 8px; border-radius: 99px; white-space: nowrap; }
.chip.ok { background: var(--field-soft); color: var(--ok); }
.chip.review { background: var(--warn-soft); color: var(--warn); }

/* reel player */
.player { aspect-ratio: 16 / 9; max-width: 100%; border-radius: 10px; position: relative; overflow: hidden;
  background: repeating-linear-gradient(90deg, #2c7a50 0 12%, #277048 12% 24%); }
.player .lines { position: absolute; inset: 8%; border: 2px solid rgba(255,255,255,.55); }
.player .lines::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 2px solid rgba(255,255,255,.55); }
.player .dot { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--pinny); color: #15211b; display: grid; place-items: center; font: 700 15px/1 var(--display); box-shadow: 0 0 0 4px rgba(240,185,35,.35); transition: left .9s ease, top .9s ease; }
.player .cap { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-end; color: #fff; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,.6); gap: 8px; }
.player .cap b { font: 700 20px/1 var(--display); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--field); transition: width .3s linear; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button.btn { font: 600 14px/1 var(--body); padding: 11px 16px; border-radius: 8px; border: 1px solid var(--field); background: var(--field); color: #fff; cursor: pointer; }
button.btn.ghost { background: transparent; color: var(--field); }
button:focus-visible, .kid:focus-visible, nav button:focus-visible { outline: 2px solid var(--pinny); outline-offset: 2px; }

/* recap email */
.email { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.email .from { font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.score { font: 700 40px/1 var(--display); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 10px; border-radius: 8px; background: var(--field-soft); }
.stat b { display: block; font: 700 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }

/* feature slot */
.slot { border: 2px dashed var(--line); border-radius: 10px; padding: 24px 16px; text-align: center; color: var(--muted); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { background: none; border: 0; padding: 10px 2px 12px; font: 600 11px/1.2 var(--body); color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
nav.tabs button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }
nav.tabs button[aria-selected="true"] { color: var(--field); }
nav.tabs button.new[aria-selected="false"] { color: var(--warn); }

.toast { position: fixed; max-width: calc(100% - 32px); left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 13px; z-index: 4; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---- Roster-tagging accuracy additions ---- */
header.team .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.role { font: 600 11px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 99px; background: rgba(255,255,255,.18); white-space: nowrap; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.summary .stat b { font-size: 26px; }
.stat.hot { background: var(--warn-soft); }
.stat.hot b { color: var(--warn); }
.frame { aspect-ratio: 16 / 9; max-width: 100%; border-radius: 10px; position: relative; overflow: hidden;
  background: repeating-linear-gradient(90deg, #2c7a50 0 12%, #277048 12% 24%); }
.frame .lines { position: absolute; inset: 8%; border: 2px solid rgba(255,255,255,.45); }
.shirt { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: 34%; aspect-ratio: 1 / 1;
  background: #f0b923; color: #15211b; display: grid; place-items: center; padding-top: 12%;
  clip-path: polygon(30% 0, 70% 0, 100% 18%, 88% 38%, 78% 32%, 78% 100%, 22% 100%, 22% 32%, 12% 38%, 0 18%);
  font: 700 clamp(30px, 11vw, 52px)/1 var(--display); font-variant-numeric: tabular-nums; }
.shirt.away { background: #2b4c8c; color: #ffffff; }
.blur { filter: blur(6px); opacity: .55; }
.frame .cap { position: absolute; left: 10px; right: 10px; bottom: 8px; display: flex; justify-content: space-between; gap: 8px; color: #fff; font: 500 12px/1.2 var(--mono); text-shadow: 0 1px 2px rgba(0,0,0,.7); }
.why { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; background: var(--warn-soft); color: var(--ink); font-size: 13px; }
.why b { color: var(--warn); }
.card { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 14px/1.2 var(--body); cursor: pointer; text-align: left; }
.choice:hover { border-color: var(--field); background: var(--field-soft); }
.choice .jersey { width: 34px; height: 34px; font-size: 18px; flex: none; }
.choice.alt { justify-content: center; color: var(--muted); font-weight: 500; }
.choice.alt.no { color: var(--warn); }
.done { text-align: center; padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.done .big { font: 700 32px/1 var(--display); color: var(--field); }
.log { text-align: left; width: 100%; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.reelclip { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.reelclip:last-child { border-bottom: 0; }
.notmine { font: 600 12px/1 var(--body); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
.notmine:hover { border-color: var(--warn); color: var(--warn); }
.confirmbox { grid-column: 1 / -1; background: var(--warn-soft); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.chip.held { background: var(--warn-soft); color: var(--warn); }
.chip.gone { background: var(--line); color: var(--muted); }
.chip.coach { background: var(--field-soft); color: var(--field); }
.pairs { display: flex; flex-wrap: wrap; gap: 6px; }
.pair { font: 500 13px/1 var(--mono); padding: 6px 9px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); }
.rules { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.rules b { font-variant-numeric: tabular-nums; }
.addrow { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 8px; }
.addrow input, select { font: 500 15px/1 var(--body); padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; }
.notice { font-size: 13px; padding: 10px 12px; border-radius: 8px; background: var(--field-soft); }
nav.tabs .in { position: relative; }
.tabbadge { position: absolute; margin-left: 14px; margin-top: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn); color: #fff; font: 700 11px/18px var(--body); }
nav.tabs button { position: relative; }
</style>
</head>
<body>

<div class="app">
  <div class="proto-flag">Prototype · sample data, not real families</div>
  <header class="team">
    <div class="top"><div class="club" id="club"></div><span class="role" id="role"></span></div>
    <h1 id="teamName"></h1>
    <div class="game" id="gameLine"></div>
  </header>
  <main id="screen"></main>
</div>

<nav class="tabs" aria-label="Screens"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ============ MOCK DATA ============ */
const DATA = {
  club: "Ridgeline Youth Soccer Club",
  team: "Rockets U10 Girls",
  coach: "Coach Dana M.",
  game: { opponent: "Eastside Eagles", date: "Sat, Oct 31", score: [3, 2], footage: "52 min · 2 halves · sideline camera" },
  roster: [
    { no: 1,  name: "Ava T." },
    { no: 4,  name: "Maya R." },
    { no: 7,  name: "Priya S." },
    { no: 9,  name: "Lena O." },
    { no: 11, name: "Hana W." },
    { no: 14, name: "Zoe K." },
    { no: 17, name: "Sofia G." },
    { no: 23, name: "Nia B." }
  ],
  // tag = number the tagger read; conf = how sure it is; seen = what the camera shows ("_" = digit hidden by an arm or fold)
  clips: [
    { id: "c1", tag: 9,  type: "Goal",   t: "08:41", half: 1, conf: 0.97, x: 82, y: 46, seen: "9" },
    { id: "c2", tag: 4,  type: "Assist", t: "08:33", half: 1, conf: 0.91, x: 66, y: 30, seen: "_4", hidden: "1" },
    { id: "c3", tag: 17, type: "Save",   t: "17:05", half: 1, conf: 0.96, x: 10, y: 52, seen: "17" },
    { id: "c4", tag: 1,  type: "Tackle", t: "22:48", half: 1, conf: 0.88, x: 38, y: 62, seen: "1_", hidden: "1" },
    { id: "c5", tag: 7,  type: "Goal",   t: "04:12", half: 2, conf: 0.97, x: 84, y: 54, seen: "7" },
    { id: "c6", tag: 23, type: "Shot",   t: "11:30", half: 2, conf: 0.86, x: 76, y: 38, seen: "23" },
    { id: "c7", tag: 9,  type: "Goal",   t: "19:57", half: 2, conf: 0.96, x: 86, y: 50, seen: "9" },
    { id: "c8", tag: 11, type: "Pass",   t: "21:02", half: 2, conf: 0.64, x: 30, y: 44, seen: "11", blur: true },
    { id: "c9", tag: 9,  type: "Tackle", t: "23:15", half: 2, conf: 0.93, x: 44, y: 58, seen: "9", away: true }
  ],
  recap: { sendTime: "Sun 9:00 am", families: 12 }
};
/* ============ END MOCK DATA ============ */

const AUTO = 0.80;   // below this, always ask the coach
const LOOK = 0.95;   // numbers with a look-alike on the roster need this much

const $ = s => document.querySelector(s);
const pct = c => Math.round(c.conf * 100);
const kid = no => DATA.roster.find(k => k.no === no);
const label = no => kid(no) ? `#${no} ${kid(no).name}` : `#${no}`;
let viewer = 9, playTimer = null, pendingHide = null, current = "check";
const log = [];

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2400); }

/* Look-alike rule: a digit added (1/11, 4/14) or digits swapped (12/21) */
function isLook(a, b) {
  const x = String(a), y = String(b); if (x === y) return false;
  const [s, l] = x.length <= y.length ? [x, y] : [y, x];
  if (s.length === 1 && l.length === 2) return l.includes(s);
  if (s.length === 2 && l.length === 2) return s[0] === l[1] && s[1] === l[0];
  return false;
}
const lookFor = no => DATA.roster.filter(k => isLook(k.no, no)).map(k => k.no);
function pairs() {
  const nos = DATA.roster.map(k => k.no).sort((a, b) => a - b), out = [];
  nos.forEach((a, i) => nos.slice(i + 1).forEach(b => { if (isLook(a, b)) out.push([a, b]); }));
  return out;
}
/* Decide each clip the system hasn't had a human answer for yet */
function classify() {
  DATA.clips.forEach(c => {
    if (!["auto", "held", undefined].includes(c.status)) return;
    const la = lookFor(c.tag);
    if (c.conf < AUTO) { c.status = "held"; c.assigned = null; c.why = `Only <b>${pct(c)}% sure</b> this is #${c.tag}.`; }
    else if (la.length && c.conf < LOOK) { c.status = "held"; c.assigned = null; c.why = `<b>#${[c.tag, ...la].join(" and #")}</b> are all on your roster, and the camera is ${pct(c)}% sure. Look-alike numbers need 95%.`; }
    else { c.status = "auto"; c.assigned = c.tag; c.why = ""; }
  });
}
const queue = () => DATA.clips.filter(c => c.status === "held" || c.status === "reported").sort((a, b) => (a.skips || 0) - (b.skips || 0));
const inReel = no => DATA.clips.filter(c => (c.status === "auto" || c.status === "confirmed") && c.assigned === no);
const published = () => DATA.clips.filter(c => c.status === "auto" || c.status === "confirmed");

function frame(c) {
  const digits = c.blur ? `<span class="blur">${c.seen}</span>` : c.seen.replace("_", `<span class="blur">${c.hidden || ""}</span>`);
  return `<div class="frame"><div class="lines"></div><div class="shirt${c.away ? " away" : ""}">${digits}</div>
    <div class="cap"><span>${c.type} · H${c.half} ${c.t}</span><span>${pct(c)}% match</span></div></div>`;
}

/* ---------- Screen 1: coach checks held clips ---------- */
function renderCheck() {
  const q = queue(), auto = DATA.clips.filter(c => c.status === "auto").length;
  const head = `<div class="stack"><span class="label">After the game</span><h2>Check clips before reels go out</h2>
    <p class="sub">${DATA.game.footage}. The recap still sends ${DATA.recap.sendTime}, with or without these.</p></div>
    <div class="summary">
      <div class="stat"><b>${DATA.clips.length}</b><span>clips found</span></div>
      <div class="stat"><b>${auto}</b><span>published automatically</span></div>
      <div class="stat${q.length ? " hot" : ""}"><b>${q.length}</b><span>need you</span></div>
    </div>`;
  if (!q.length) return head + `<div class="panel done"><div class="big">All clear</div>
    <p class="sub">Every clip is in the right kid's reel or removed.</p>
    ${log.length ? `<div class="log">${log.map(l => `<div>✓ ${l}</div>`).join("")}</div>` : ""}
    <button class="btn" data-go="reel">See a family's reel</button></div>`;
  const c = q[0];
  const cands = [...new Set([c.tag, ...lookFor(c.tag)])].filter(kid);
  return head + `<div class="panel card">
    <div class="row" style="justify-content:space-between"><span class="label">Clip 1 of ${q.length}</span>
      ${c.status === "reported" ? `<span class="chip held">Reported by a parent</span>` : `<span class="chip held">Held</span>`}</div>
    ${frame(c)}
    <div class="why"><span>${c.why}</span></div>
    <div class="stack"><b>Who is this?</b>
      <div class="choices">${cands.map(no => `<button class="choice" data-assign="${c.id}" data-no="${no}"><span class="jersey">${no}</span>${kid(no).name}</button>`).join("")}
        <button class="choice alt no" data-assign="${c.id}" data-no="none">Not our player</button>
        <button class="choice alt" data-skip="${c.id}">Skip for now</button>
      </div></div>
  </div>`;
}

/* ---------- Screen 2: family watches the reel, can flag a wrong clip ---------- */
function renderReel() {
  const k = kid(viewer), cl = inReel(viewer);
  return `<div class="stack"><span class="label">Viewing as</span>
    <select id="viewer" aria-label="Family">${DATA.roster.map(r => `<option value="${r.no}"${r.no === viewer ? " selected" : ""}>${r.name}'s family (#${r.no})</option>`).join("")}</select></div>
  <div class="stack"><span class="label">Personal reel</span><h2>#${k.no} ${k.name}</h2>
    <p class="sub">${cl.length} moment${cl.length === 1 ? "" : "s"} vs ${DATA.game.opponent} · ${DATA.game.date}</p></div>
  ${cl.length ? `<div class="player"><div class="lines"></div><div class="dot" id="dot" style="left:50%;top:50%">${k.no}</div>
    <div class="cap"><span><b id="capType">Ready</b><br><span id="capTime">${cl.length} clips</span></span><span id="capIdx"></span></div></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="row"><button class="btn" id="play">Play reel</button></div>` : `<div class="slot">No clips for ${k.name} yet. Clips the coach confirms show up here.</div>`}
  <div class="panel">${cl.map(c => `<div class="reelclip">
      <span class="ts">${c.t}<small>Half ${c.half}</small></span>
      <span><b>${c.type}</b><br><span class="sub">${c.status === "confirmed" ? "Checked by coach" : "Auto-tagged"}</span></span>
      <button class="notmine" data-flag="${c.id}">Not my kid</button>
      ${pendingHide === c.id ? `<div class="confirmbox"><span>Hide this clip from ${k.name}'s reel? ${DATA.coach} will check who it is. It won't be moved to another child's reel automatically.</span>
        <div class="row"><button class="btn" data-hide="${c.id}">Hide clip</button><button class="btn ghost" data-cancel="1">Cancel</button></div></div>` : ""}
    </div>`).join("")}</div>`;
}
function playReel() {
  const cl = inReel(viewer); clearInterval(playTimer); let i = 0;
  const step = () => {
    const dot = $("#dot"); if (!dot || i >= cl.length) { clearInterval(playTimer); if ($("#capType")) $("#capType").textContent = "End of reel"; return; }
    const c = cl[i]; dot.style.left = c.x + "%"; dot.style.top = c.y + "%";
    $("#capType").textContent = c.type; $("#capTime").textContent = `Half ${c.half} · ${c.t}`;
    $("#capIdx").textContent = `${i + 1}/${cl.length}`; $("#prog").style.width = ((i + 1) / cl.length * 100) + "%"; i++;
  };
  step(); playTimer = setInterval(step, 1500);
}

/* ---------- Screen 3: weekly recap sends on time, held clips left out ---------- */
function renderRecap() {
  const [us, them] = DATA.game.score, pub = published(), q = queue();
  const featured = new Set(pub.map(c => c.assigned));
  const missing = DATA.roster.filter(k => !featured.has(k.no));
  return `<div class="stack"><span class="label">Weekly family recap</span><h2>Sends ${DATA.recap.sendTime}</h2></div>
  ${q.length ? `<div class="why"><span><b>${q.length} clip${q.length > 1 ? "s" : ""} still waiting for the coach.</b> They're left out of the recap and thumbnails. The recap still sends on time.</span></div>`
             : `<div class="notice">Every clip is checked. Nothing held back.</div>`}
  <div class="panel email">
    <div class="from">From: ${DATA.coach} via SidelineReel<br>To: ${DATA.recap.families} families on the ${DATA.team} roster</div>
    <span class="label">${DATA.game.date} · vs ${DATA.game.opponent}</span>
    <div class="score">${us}–${them} ${us > them ? "Win" : us < them ? "Loss" : "Draw"}</div>
    <div class="stats">
      <div class="stat"><b>${pub.length}</b><span>highlights</span></div>
      <div class="stat"><b>${featured.size}/${DATA.roster.length}</b><span>players featured</span></div>
      <div class="stat"><b>${pub.filter(c => c.type === "Goal").length}</b><span>goals on film</span></div>
    </div>
    <button class="btn" data-go="reel">Watch your player's reel</button>
  </div>
  ${missing.length ? `<p class="sub">Coach only: no clips yet for ${missing.map(k => `#${k.no} ${k.name}`).join(", ")}.</p>` : ""}`;
}

/* ---------- Coach: every clip and its status ---------- */
function renderClips() {
  const chip = c => ({ auto: `<span class="chip ok">Published</span>`, confirmed: `<span class="chip coach">Coach confirmed</span>`,
    held: `<span class="chip held">Needs check</span>`, reported: `<span class="chip held">Parent reported</span>`, rejected: `<span class="chip gone">Not our player</span>` })[c.status];
  return `<div class="stack"><h2>All clips</h2><p class="sub">Tagged number, how sure the camera was, and where each clip went.</p></div>
  <div class="panel">${DATA.clips.map(c => `<div class="clip">
    <span class="ts">${c.t}<small>Half ${c.half}</small></span>
    <span><b>Read as #${c.tag}</b>${c.assigned && c.assigned !== c.tag ? ` → ${label(c.assigned)}` : ""}<br><span class="sub">${c.type} · ${pct(c)}% match</span></span>
    ${chip(c)}</div>`).join("")}</div>`;
}

/* ---------- Coach: roster and look-alike numbers ---------- */
function renderTeam() {
  const p = pairs();
  return `<div class="stack"><h2>Roster</h2><p class="sub">Look-alike numbers are found automatically when the roster changes.</p></div>
  <div class="stack"><span class="label">Look-alike numbers on this roster</span>
    <div class="pairs">${p.length ? p.map(([a, b]) => `<span class="pair">${a} · ${b}</span>`).join("") : `<span class="sub">None</span>`}</div></div>
  <div class="panel rules">
    <span>Publish automatically when the camera is at least <b>80%</b> sure.</span>
    <span>Numbers with a look-alike on the roster need <b>95%</b>.</span>
    <span>Everything else waits for the coach. Unchecked clips expire after <b>7 days</b> and are never published.</span>
  </div>
  <div class="panel">${DATA.roster.slice().sort((a, b) => a.no - b.no).map(k => {
    const la = lookFor(k.no);
    return `<div class="kid" style="cursor:default"><span class="jersey">${k.no}</span>
      <span><span class="name">${k.name}</span><br><span class="meta">${la.length ? `Looks like #${la.join(", #")}` : "No look-alikes"}</span></span>
      <span class="count">${inReel(k.no).length} clips</span></div>`; }).join("")}</div>
  <form class="stack" id="addForm"><span class="label">Add a player</span>
    <div class="addrow"><input id="addNo" type="number" min="0" max="99" placeholder="No." required>
      <input id="addName" type="text" placeholder="Name" required><button class="btn" type="submit">Add</button></div></form>`;
}

const SCREENS = {
  check: { label: "Check", role: "Coach view",  render: renderCheck, icon: '<path d="M4 12l5 5L20 6"/>' },
  reel:  { label: "Reel",  role: "Family view", render: renderReel,  icon: '<circle cx="12" cy="12" r="9"/><path d="M10 9l5 3-5 3z"/>' },
  recap: { label: "Recap", role: "Family view", render: renderRecap, icon: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>' },
  clips: { label: "Clips", role: "Coach view",  render: renderClips, icon: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 5v14M16 5v14"/>' },
  team:  { label: "Team",  role: "Coach view",  render: renderTeam,  icon: '<path d="M16 19v-1a4 4 0 0 0-8 0v1"/><circle cx="12" cy="8" r="3"/>' }
};

function go(id) {
  current = id; clearInterval(playTimer);
  $("#screen").innerHTML = SCREENS[id].render();
  $("#role").textContent = SCREENS[id].role;
  const n = queue().length;
  $("#tabs").innerHTML = Object.entries(SCREENS).map(([k, s]) =>
    `<button data-tab="${k}" aria-selected="${k === id}"><svg viewBox="0 0 24 24">${s.icon}</svg>${s.label}${k === "check" && n ? `<span class="tabbadge">${n}</span>` : ""}</button>`).join("");
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const find = id => DATA.clips.find(c => c.id === id);
  if (b.dataset.tab) { pendingHide = null; go(b.dataset.tab); window.scrollTo(0, 0); }
  else if (b.dataset.go) { go(b.dataset.go); window.scrollTo(0, 0); }
  else if (b.dataset.assign) {
    const c = find(b.dataset.assign), no = b.dataset.no;
    if (no === "none") { c.status = "rejected"; c.assigned = null; log.push(`${c.type} at ${c.t} removed: not our player`); toast("Removed from all reels"); }
    else { c.status = "confirmed"; c.assigned = +no; log.push(`${c.type} at ${c.t} → ${label(+no)}`); toast(`Added to ${kid(+no).name}'s reel`); }
    go("check");
  }
  else if (b.dataset.skip) { const c = find(b.dataset.skip); c.skips = (c.skips || 0) + 1; toast("Skipped. It stays out of reels until checked."); go("check"); }
  else if (b.dataset.flag) { pendingHide = b.dataset.flag; go("reel"); }
  else if (b.dataset.cancel) { pendingHide = null; go("reel"); }
  else if (b.dataset.hide) {
    const c = find(b.dataset.hide);
    c.status = "reported"; c.assigned = null; c.skips = 0;
    c.why = `<b>${kid(viewer).name}'s family</b> says this isn't their child. Check who it is, or remove it.`;
    pendingHide = null; toast(`Hidden. ${DATA.coach} will check it.`); go("reel");
  }
  else if (b.id === "play") playReel();
});
document.addEventListener("change", e => { if (e.target.id === "viewer") { viewer = +e.target.value; pendingHide = null; go("reel"); } });
document.addEventListener("submit", e => {
  e.preventDefault();
  const no = parseInt($("#addNo").value, 10), name = $("#addName").value.trim();
  if (!(no >= 0 && no <= 99) || !name) return toast("Enter a number from 0 to 99 and a name.");
  if (kid(no)) return toast(`#${no} is already on the roster.`);
  DATA.roster.push({ no, name }); classify();
  const la = lookFor(no);
  toast(la.length ? `#${no} added. Looks like #${la.join(", #")}, so those clips now need 95%.` : `#${no} added. No look-alikes.`);
  go("team");
});

$("#club").textContent = DATA.club;
$("#teamName").textContent = DATA.team;
$("#gameLine").textContent = `vs ${DATA.game.opponent} · ${DATA.game.date} · ${DATA.game.score.join("–")}`;
classify();
go("check");
</script>
</body>
</html>
